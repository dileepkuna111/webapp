<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple web application deployed with Jenkins CI/CD.">
  <title>My First CI/CD Web App</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           padding: 24px; background: linear-gradient(135deg, #eef2ff, #f8fafc); color: #172033; }
    main { width: min(720px, 100%); padding: clamp(28px, 6vw, 56px); border-radius: 24px;
           background: white; box-shadow: 0 20px 60px rgba(30, 41, 59, .12); text-align: center; }
    .tag { display: inline-block; padding: 7px 12px; border-radius: 999px;
           background: #e0e7ff; color: #3730a3; font-size: .85rem; font-weight: 700; }
    h1 { margin: 22px 0 12px; font-size: clamp(2rem, 6vw, 3.25rem); }
    p { color: #526078; line-height: 1.7; }
    .status { margin: 28px auto 0; padding: 14px 18px; max-width: 420px;
              border: 1px solid #bbf7d0; border-radius: 12px; background: #f0fdf4; color: #166534; }
    footer { margin-top: 30px; color: #8490a5; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <span class="tag">Jenkins CI/CD Demo</span>
    <h1>Hello, World!</h1>
    <p>Your first static web application is running on Amazon Linux with Nginx.</p>
    <div class="status" role="status">
      <strong>Deployment status:</strong> Successful
    </div>
    <footer>Source: GitHub · Pipeline: Jenkins · Web server: Nginx</footer>
  </main>
</body>
</html>
